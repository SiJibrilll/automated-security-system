services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: automated-security-app:latest
    container_name: automated_security_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    env_file:
      - .env
    environment:
      # Override DB host to use docker service name
      DB_HOST: "${DOCKER_DB_HOST:-db}"
      DB_PORT: "3306"
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
      ENABLE_QUEUE_WORKER: "${ENABLE_QUEUE_WORKER:-true}"
      ENABLE_SCHEDULER: "${ENABLE_SCHEDULER:-true}"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  db:
    image: mariadb:11
    container_name: automated_security_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret}"
      MARIADB_DATABASE: "${DB_DATABASE:-automated}"
      MARIADB_USER: "${DB_USERNAME:-laravel}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  app_storage:
    driver: local
  db_data:
    driver: local
